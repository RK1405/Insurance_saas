# One-click test deployment on Render (https://render.com): New → Blueprint → pick this repo.
# Creates a free PostgreSQL database and the HealthStack web service (built from the Dockerfile),
# loaded with demo data. Render has no India region; Singapore is the closest.
# Use this for TESTING ONLY. Host real customer data in India (see README).
databases:
  - name: healthstack-db
    plan: free
    region: singapore
    databaseName: healthstack
    user: healthstack

services:
  - type: web
    name: healthstack
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthstack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
